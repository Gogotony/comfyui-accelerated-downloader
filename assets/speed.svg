<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="fast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="slow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" rx="16" fill="#0b1220"/>
  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e2e8f0">DOWNLOAD SPEED</text>
  <text x="40" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Measured on a real 100-file / 732&nbsp;GB deployment · HF direct · 0 failed downloads</text>

  <!-- Official -->
  <text x="40" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Official single-thread</text>
  <rect x="40" y="140" width="14" height="34" rx="6" fill="url(#slow)"/>
  <text x="64" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">~0.5 MB/s</text>
  <text x="150" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">30-min wait per 1 GB</text>

  <!-- This tool -->
  <text x="40" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">This tool — aria2 16× + mirror racing</text>
  <rect x="40" y="234" width="760" height="34" rx="6" fill="url(#fast)"/>
  <text x="64" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#082f49">~200 MB/s</text>
  <text x="185" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0e7490">~400× faster · 732 GB in ~1 hour</text>

  <text x="40" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Bars not to scale — speed ratio ≈ 400×</text>
</svg>
